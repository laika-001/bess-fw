# BESS dashboard. Replaces the Saturn Gateway proxy (the previous file is kept
# as /etc/nginx/sites-available/default.before-bess).
# Source: bess-fw/pi/nginx-bess.conf, installed by pi/deploy.sh.

upstream bess_dashboard {
    server 127.0.0.1:8080;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _ laika-iiot.com;

    # Same certificate as before, so HTTPS keeps working for clients that trust the Laika root CA.
    ssl_certificate           /etc/ssl/certs/laika/laika-server.crt;
    ssl_certificate_key       /etc/ssl/private/laika/laika-server.key;
    ssl_trusted_certificate   /etc/ssl/certs/laika/laika-rootCA.crt;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Live updates: Server-Sent Events must not be buffered.
    location = /api/events {
        proxy_pass http://bess_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://bess_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /laika-rootCA.crt {
        alias /etc/ssl/certs/laika/laika-rootCA.crt;
        default_type application/x-x509-ca-cert;
    }
}
